name: Quick Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  quick-test:
    name: Quick validation and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        env:
          ORAS_BIN_DEV: true
      
      - name: Build packages
        run: npm run build
      
      - name: Validate dual package structure
        run: node validate-build.js
      
      - name: Run all tests
        run: |
          echo "Running TypeScript tests..."
          npm test
          
          echo "Testing CommonJS compatibility..."
          npm run test:cjs
          
          echo "Testing ESM compatibility..."
          npm run test:esm
          
          echo "All tests passed! ✅"
      
      - name: Check exports work correctly
        run: |
          echo "Testing package exports..."
          node -p "typeof require('./dist/index.js').default === 'function'"
          node -p "typeof require('./dist/index.js').getOrasBinaryPath === 'function'"
