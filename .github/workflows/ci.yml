name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - feature/**
      - feat/**
      - bugfix/**
      - fix/**
      - hotfix/**
      - chore/**
      - refactor/**
      - release/**

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24.x"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ORAS_BIN_DEV: true

      - name: Download oras binaries (latest)
        run: bash update-oras-binaries.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build
        run: npm run build

      - name: Run tests
        run: |
          npm test
          npm run test:cjs
          npm run test:esm
