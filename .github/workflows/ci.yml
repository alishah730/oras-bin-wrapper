name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ORAS_BIN_DEV: true

      - name: Download oras binaries (latest)
        run: bash update-oras-binaries.sh

      - name: Build
        run: npm run build

      - name: Run tests
        run: |
          npm test
          npm run test:cjs
          npm run test:esm
