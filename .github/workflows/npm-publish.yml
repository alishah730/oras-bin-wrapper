name: Build, Test and Publish to npm

on:
  push:
    branches: ['**']
    tags:
      - 'v*.*.*'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org/'
      - name: Install dependencies
        run: npm ci
        env:
          ORAS_BIN_DEV: true
      - name: Build dual packages
        run: npm run build
      - name: Run TypeScript tests
        run: npm test
      - name: Test CommonJS compatibility
        run: npm run test:cjs
      - name: Test ESM compatibility
        run: npm run test:esm
      - name: Validate build output
        run: node validate-build.js
  
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org/'
      - name: Install dependencies (dev mode)
        run: npm ci
        env:
          ORAS_BIN_DEV: true
      - name: Build dual packages
        run: npm run build
      - name: Final validation before publish
        run: |
          echo "Validating package structure..."
          node validate-build.js
          echo "Testing both package formats..."
          npm run test:cjs
          npm run test:esm
          echo "Package ready for publication!"
      - name: Publish to npm
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [[ $TAG_VERSION =~ -[a-zA-Z] ]]; then
            # Prerelease version - extract prerelease identifier
            PRERELEASE_TAG=$(echo $TAG_VERSION | sed -n 's/.*-\([a-zA-Z][a-zA-Z0-9]*\).*/\1/p')
            echo "Publishing prerelease version $TAG_VERSION with tag: $PRERELEASE_TAG"
            npm publish --provenance --access public --tag $PRERELEASE_TAG
          else 
            # Stable release
            echo "Publishing stable version $TAG_VERSION"
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOEKEN_NO_OTP }}

