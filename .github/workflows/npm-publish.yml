name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org/"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download oras binaries
        run: bash update-oras-binaries.sh "${{ steps.version.outputs.VERSION }}"

      - name: Verify binaries downloaded
        run: ls -lh lib/oras_*

      - name: Install dependencies
        run: npm ci
        env:
          ORAS_BIN_DEV: true

      - name: Build
        run: npm run build

      - name: Set package version
        run: npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version

      - name: Run tests
        run: |
          npm test
          npm run test:cjs
          npm run test:esm

      - name: Publish to npm
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            TAG=$(echo "$VERSION" | sed -n 's/.*-\([a-zA-Z][a-zA-Z0-9]*\).*/\1/p')
            echo "Publishing $VERSION with tag: $TAG"
            npm publish --provenance --access public --tag "$TAG"
          else
            echo "Publishing $VERSION as latest"
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOEKEN_NO_OTP }}
